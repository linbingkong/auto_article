[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-auto-article-agent"
version = "0.2.0"
description = "自研微信公众号热点选题、写作、配图、排版、Web 管理与草稿投递 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "APScheduler>=3.10",
  "FastAPI>=0.110",
  "uvicorn>=0.29",
  "bcrypt>=4.0",
  "cryptography>=42.0",
  "qrcode[pil]>=7.4",
  "Markdown>=3.5",
  "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wechat-agent = "wechat_agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
