<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="观思辩明公众号智能体管理台" />
  <title>观思辩明 · 公众号智能体</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="观思辩明首页">
        <img class="brand-mark" src="/assets/brand-symbol.png" alt="观思辩明 Logo" />
        <span><strong>观思辩明</strong><small>公众号智能体</small></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <p class="nav-section">工作台</p>
        <a href="#dashboard" data-page="dashboard"><span class="nav-icon">⌂</span>概览</a>
        <a href="#hotspots" data-page="hotspots"><span class="nav-icon">⌁</span>热点选题</a>
        <a href="#articles" data-page="articles"><span class="nav-icon">▤</span>文章内容</a>
        <p class="nav-section">运营</p>
        <a href="#tasks" data-page="tasks"><span class="nav-icon">◴</span>任务日志</a>
        <a href="#history" data-page="history"><span class="nav-icon">↗</span>发布复盘</a>
        <p class="nav-section">个人</p>
        <a href="#billing" data-page="billing" data-permission="article.create"><span class="nav-icon">¥</span>生成额度</a>
        <a href="#my-api-config" data-page="my-api-config" data-permission="article.create"><span class="nav-icon">⌘</span>我的 API 配置</a>
        <p class="nav-section">系统</p>
        <a href="#config" data-page="config"><span class="nav-icon">⚙</span>配置中心</a>
        <a href="#users" data-page="users" data-role="admin" style="display:none"><span class="nav-icon">◎</span>用户管理</a>
        <a href="#registrations" data-page="registrations" data-role="admin" style="display:none"><span class="nav-icon">✓</span>注册审批</a>
        <a href="#payment-orders" data-page="payment-orders" data-role="admin" style="display:none"><span class="nav-icon">¥</span>支付订单</a>
        <a href="#token-usage" data-page="token-usage" data-role="admin" style="display:none"><span class="nav-icon">∑</span>Token 成本</a>
        <a href="#audit" data-page="audit" data-role="admin" style="display:none"><span class="nav-icon">▤</span>审计日志</a>
        <a href="#help" data-page="help"><span class="nav-icon">?</span>使用指南</a>
      </nav>
      <div class="sidebar-footer">
        <div class="agent-state"><i></i><span>Agent 服务在线</span></div>
        <span class="version">v0.2.0 · Draft first</span>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <section class="workspace">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menuButton" aria-label="打开菜单">☰</button>
        <div class="page-heading">
          <p id="breadcrumb">工作台</p>
          <h1 id="pageTitle">概览</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="refreshButton" title="刷新当前页面">↻</button>
          <div class="user-box" id="userBox" style="display:none">
            <span class="user-role" id="userRole"></span>
            <span class="user-name" id="userName"></span>
            <button class="icon-button" id="logoutButton" title="退出登录">⎋</button>
          </div>
        </div>
      </header>
      <main id="app" class="main-content" aria-live="polite">
        <div class="loading-state"><span class="spinner"></span><p>正在加载管理台…</p></div>
      </main>
    </section>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
